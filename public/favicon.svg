<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0A2A5E" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD000" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Background circle for favicon clarity -->
  <rect width="120" height="120" rx="24" fill="#0B1320" />

  <!-- Construction Crane in Orange -->
  <g stroke="#FF6A00" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Mast -->
    <line x1="68" y1="20" x2="68" y2="44" />
    <!-- Jib -->
    <line x1="48" y1="20" x2="98" y2="20" />
    <!-- Tower top triangle -->
    <polygon points="68,13 63,20 73,20" fill="#FF6A00" />
    <line x1="68" y1="13" x2="52" y2="20" />
    <line x1="68" y1="13" x2="88" y2="20" />
    <!-- Counterweight -->
    <rect x="49" y="21" width="5" height="4" fill="#FF6A00" />
    <!-- Trolley & Cable & Hook -->
    <rect x="86" y="19" width="4" height="2" fill="#FF6A00" />
    <line x1="88" y1="21" x2="88" y2="30" stroke="#FF6A00" stroke-width="1.2" />
    <path d="M88,30 C88,34 85,34 85,32 C85,30.5 87,30.5 87,31" stroke="#FF6A00" stroke-width="1.5" />
  </g>

  <!-- Modern Glass Towers (Isometric Facets) -->
  <!-- Left Tower -->
  <polygon points="34,42 46,32 46,72 34,76" fill="#0F243E" />
  <polygon points="46,32 54,26 54,68 46,72" fill="#0284C7" />
  <polygon points="46,32 54,26 48,23 40,28" fill="#38BDF8" />

  <!-- Center Tall Tower -->
  <polygon points="52,40 64,22 64,68 52,70" fill="#08182B" />
  <polygon points="64,22 74,16 74,64 64,68" fill="#0369A1" />
  <polygon points="64,22 74,16 68,13 58,18" fill="#38BDF8" />

  <!-- Right Tower -->
  <polygon points="72,36 82,30 82,62 72,64" fill="#0B2038" />
  <polygon points="82,30 88,27 88,58 82,62" fill="#0284C7" />

  <!-- Dynamic Highway Curve -->
  <!-- Yellow speed ribbon on left shoulder -->
  <path d="M28,84 Q52,72 68,63 Q76,58 84,54" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />
  <!-- Asphalt Road -->
  <path d="M36,92 Q58,78 72,66 Q80,60 88,56 L94,59 Q82,66 70,76 Q52,90 40,97 Z" fill="#1E293B" stroke="#0F172A" stroke-width="0.8" />
  <!-- White dashed median line -->
  <path d="M39,94 Q56,83 71,71 Q79,64 89,57" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-dasharray="3,3" stroke-linecap="round" />

  <!-- Dynamic 3D "ES" Monogram -->
  <!-- Letter E (Deep Navy & Cyan Facets) -->
  <path d="M26,38 L48,30 L48,40 L38,44 L46,47 L46,55 L38,58 L49,61 L46,70 L26,63 Z" fill="#0E2A4A" stroke="#38BDF8" stroke-width="1" />

  <!-- Letter S (Curving Blue Ribbon overlapping highway) -->
  <path d="M80,38 C75,34 66,35 62,38 C56,42 58,48 64,50 C74,53 82,56 80,68 C78,78 64,82 52,78 C46,76 42,72 40,68 L48,64 C50,68 56,71 62,71 C68,71 70,67 70,63 C70,58 64,55 58,52 C50,48 46,42 50,34 C54,26 66,24 76,28 Z" fill="url(#sGrad)" />

  <!-- Mini ES-BTP gold badge at bottom -->
  <text x="60" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="12" text-anchor="middle" fill="#FAB005" letter-spacing="1">ES-BTP</text>
</svg>
