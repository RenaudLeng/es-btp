<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="angtiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1320" />
      <stop offset="100%" stop-color="#070E18" />
    </linearGradient>
  </defs>

  <!-- Fond -->
  <rect width="100" height="100" rx="16" fill="url(#angtiBg)" />
  <rect x="3" y="3" width="94" height="94" rx="13" stroke="#3A75C4" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Arc tricolore Gabon Grands Travaux -->
  <g transform="translate(10, 12)">
    <!-- Arcs de pont & route Gabon -->
    <path d="M 6 48 C 22 16 58 16 74 48" stroke="#009E60" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M 12 52 C 26 24 54 24 68 52" stroke="#FCD116" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 18 56 C 28 32 52 32 62 56" stroke="#3A75C4" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Ligne tablier -->
    <line x1="2" y1="58" x2="78" y2="58" stroke="#FFFFFF" stroke-width="2.5" />
    <line x1="40" y1="18" x2="40" y2="58" stroke="#FCD116" stroke-width="2" />

    <!-- Sigle ANGTI -->
    <text x="40" y="74" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" letter-spacing="1.5">
      ANGTI
    </text>
  </g>
</svg>
