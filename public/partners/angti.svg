<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100" fill="none">
  <defs>
    <linearGradient id="gabGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#009E60" />
      <stop offset="100%" stop-color="#05C46B" />
    </linearGradient>
    <linearGradient id="gabYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD32A" />
      <stop offset="100%" stop-color="#FCD116" />
    </linearGradient>
    <linearGradient id="gabBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0984E3" />
      <stop offset="100%" stop-color="#3A75C4" />
    </linearGradient>
    <filter id="angtiGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Emblem: Infrastructure Arc & Bridge with Gabon Tricolor -->
  <g transform="translate(10, 8)" filter="url(#angtiGlow)">
    <!-- Bridge Suspension / Roadway Arc -->
    <path d="M 6 62 C 22 28 54 28 70 62" stroke="url(#gabGreen)" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M 12 66 C 24 38 52 38 64 66" stroke="url(#gabYellow)" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 18 70 C 26 48 50 48 58 70" stroke="url(#gabBlue)" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Road Deck & Suspension Cables -->
    <line x1="2" y1="72" x2="74" y2="72" stroke="#FFFFFF" stroke-width="2.5" />
    <line x1="38" y1="30" x2="38" y2="72" stroke="#FCD116" stroke-width="2" />
    <line x1="26" y1="36" x2="26" y2="72" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.8" />
    <line x1="50" y1="36" x2="50" y2="72" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.8" />
  </g>

  <!-- Typography: ANGTI -->
  <g transform="translate(94, 20)">
    <text x="0" y="32" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="900" font-size="30" fill="#009E60" letter-spacing="2">
      A
    </text>
    <text x="26" y="32" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="900" font-size="30" fill="#FCD116" letter-spacing="2">
      N
    </text>
    <text x="56" y="32" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="900" font-size="30" fill="#3A75C4" letter-spacing="2">
      G
    </text>
    <text x="86" y="32" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="900" font-size="30" fill="#FFFFFF" letter-spacing="2">
      TI
    </text>

    <!-- Subtitle: AGENCE NATIONALE DES GRANDS TRAVAUX D'INFRASTRUCTURES -->
    <text x="2" y="48" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="700" font-size="8" fill="#94A3B8" letter-spacing="1.2">
      AGENCE NATIONALE DES GRANDS TRAVAUX
    </text>
    <text x="2" y="58" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="800" font-size="8" fill="#FCD116" letter-spacing="2">
      D'INFRASTRUCTURES • GABON
    </text>
  </g>
</svg>
